<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <script>
      // redirect logic for GitHub Pages
      ;(() => {
        const url = new URL(location)
        const base = "/lantern-loft"
        const path = url.pathname.slice(base.length)

        url.pathname = `${base}/`
        url.searchParams.set("p", path)
        location.replace(url)
      })()
    </script>
  </head>
</html>
