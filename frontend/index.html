<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/title-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lantern Loft</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Birthstone+Bounce:wght@500&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <!-- 404 redirect fix for GitHub Pages -->
    <script>
      ;(function () {
        const params = new URLSearchParams(window.location.search)

        const path = params.get("p")

        if (!path) return

        const query = params.get("q")

        const url =
          window.location.pathname +
          path +
          (query ? "?" + query.replace(/~and~/g, "&") : "") +
          window.location.hash

        window.history.replaceState(null, "", url)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
